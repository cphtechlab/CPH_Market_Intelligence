version: "3.8"

services:
  market-api:
    build: .
    container_name: market-api
    restart: unless-stopped
    env_file:
      - .env
    # Bemærk: Vi exposer ikke direkte ports, Traefik håndterer det internt!
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-api.rule=Host(`api.cphtechlab.dk`)"
      - "traefik.http.routers.market-api.entrypoints=websecure"
      - "traefik.http.routers.market-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.market-api.loadbalancer.server.port=8000"
